<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المنصة المحلية</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8e9ec;
    --muted: #8a8f9c;
    --accent: #5b8cff;
    --user-bubble: #5b8cff;
    --assistant-bubble: #1e222b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 820px; margin: 0 auto; }

  header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { font-size: 12px; color: var(--muted); }
  #status.ok::before { content: "● "; color: #4caf50; }
  #status.err::before { content: "● "; color: #e05555; }

  #messages {
    flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-left-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; background: none; }

  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge { background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px; }

  #composer {
    border-top: 1px solid var(--border); padding: 12px 14px;
    display: flex; gap: 8px; align-items: flex-end; background: var(--panel);
  }
  #uploadBtn, #sendBtn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 14px;
  }
  #sendBtn { background: var(--accent); border-color: var(--accent); color: white; }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
  #input {
    flex: 1; resize: none; max-height: 140px; min-height: 42px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  #fileInput { display: none; }
  #fileChip { font-size: 12px; color: var(--muted); padding: 0 4px; }

  .typing { display: inline-flex; gap: 4px; align-items: center; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>المنصة المحلية</h1>
    <div id="status">جارٍ الاتصال...</div>
  </header>

  <div id="messages"></div>

  <div id="composer">
    <input id="fileInput" type="file" />
    <button id="uploadBtn" title="رفع ملف للتحليل (RAG)">📎</button>
    <textarea id="input" placeholder="اكتب رسالتك..." rows="1"></textarea>
    <button id="sendBtn">إرسال</button>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const uploadBtn = document.getElementById("uploadBtn");
const fileInput = document.getElementById("fileInput");
const statusEl = document.getElementById("status");

const STORAGE_KEY = "local-ai-platform:history";
let history = [];
try {
  history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
} catch (e) { history = []; }

const ROLE_LABELS = {
  writer_general: "كاتب عام",
  coder: "برمجة",
  researcher_rag: "باحث ملفات",
  tool_caller: "تنفيذ أدوات",
  vision: "رؤية",
};

function saveHistory() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
}

function renderMessage(role, content, meta) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = content;

  if (meta) {
    const metaEl = document.createElement("div");
    metaEl.className = "meta";
    if (meta.role) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = ROLE_LABELS[meta.role] || meta.role;
      metaEl.appendChild(badge);
    }
    if (meta.tools && meta.tools.length) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "🔧 " + meta.tools.join(", ");
      metaEl.appendChild(badge);
    }
    if (meta.sources && meta.sources.length) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "📄 " + meta.sources.join(", ");
      metaEl.appendChild(badge);
    }
    div.appendChild(metaEl);
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function renderSystem(text) {
  const div = document.createElement("div");
  div.className = "msg system";
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderTyping() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function checkHealth() {
  try {
    const r = await fetch(API_BASE + "/health");
    const data = await r.json();
    statusEl.textContent = `متصل — ${data.hardware_tier} (${data.ram_gb} GB)`;
    statusEl.className = "ok";
  } catch (e) {
    statusEl.textContent = "غير متصل بالسيرفر";
    statusEl.className = "err";
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;

  history.push({ role: "user", content: text });
  renderMessage("user", text);
  saveHistory();

  const typingEl = renderTyping();

  try {
    const r = await fetch(API_BASE + "/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "council", messages: history }),
    });
    const data = await r.json();
    typingEl.remove();

    if (!r.ok) {
      renderSystem("خطأ: " + (data.detail || r.status));
      return;
    }

    const content = data.choices[0].message.content;
    history.push({ role: "assistant", content });
    saveHistory();

    renderMessage("assistant", content, {
      role: data.x_router && data.x_router.role,
      tools: (data.x_tool_trace || []).map(t => t.tool),
      sources: data.x_sources || [],
    });
  } catch (e) {
    typingEl.remove();
    renderSystem("تعذر الوصول للسيرفر: " + e.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function uploadFile(file) {
  renderSystem(`جارٍ رفع ورفهرسة "${file.name}"...`);
  const formData = new FormData();
  formData.append("file", file);
  try {
    const r = await fetch(API_BASE + "/upload", { method: "POST", body: formData });
    const data = await r.json();
    if (!r.ok) {
      renderSystem("فشل الرفع: " + (data.detail || r.status));
      return;
    }
    renderSystem(`تم: "${data.filename}" مقسّم لـ ${data.chunks_indexed} مقطع — اسأل عنه الآن.`);
  } catch (e) {
    renderSystem("تعذر رفع الملف: " + e.message);
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

uploadBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
  fileInput.value = "";
});

// Restore prior conversation on load.
for (const turn of history) {
  renderMessage(turn.role, turn.content);
}

checkHealth();
</script>
</body>
</html>
