# Model registry — the single source of truth for every agent role.
# Tags are pulled directly from Hugging Face via Ollama's `hf.co/...` support
# (verified against the actual repo file listings on huggingface.co/Qwen),
# not Ollama's own library — picked for minimum footprint on weak/CPU-only
# hardware. Verified pulled and present via `ollama list` on 2026-09-16:
#   hf.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M        (491 MB)
#   hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M        (1.1 GB)
#   hf.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M  (1.1 GB)
# Three files, ~2.7 GB total, vs. the previous qwen2.5:3b/7b + phi3:mini
# lineup's ~9 GB — and every active role now runs a 0.5B-1.5B model instead
# of 3B, roughly halving per-request RAM/CPU cost.
#
# tier: "min"  -> used when detected free RAM < min_ram_gb_recommended (config/hardware.py)
# tier: "std"  -> default tier for a normal 16GB machine

router:
  role: "task classifier — decides which agent handles the request"
  ollama_tag: "hf.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
  est_ram_gb: 0.6
  keep_alive: "30m"          # router is called on every message, keep it hot
  context_window: 8192

embedder:
  role: "semantic routing + tool retrieval + RAG embeddings"
  ollama_tag: "nomic-embed-text:latest"   # already the smallest sane option (137M) — unchanged
  est_ram_gb: 0.3
  keep_alive: "30m"
  context_window: 2048

writer_general:
  role: "general chat, Arabic/English writing, summarizing, reasoning"
  ollama_tag: "hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
  est_ram_gb: 1.3
  keep_alive: "5m"
  context_window: 8192

coder:
  role: "code generation, debugging, shell/script authoring"
  # Measured on this machine: 1.5B is UNRELIABLE on Arabic coding requests —
  # got "العاملي (factorial)" right but silently mangled "تعكس نص" (reverse
  # a string) into an unrelated print function, twice, at different
  # temperatures. 3B got both right on the first try. ~800MB heavier for a
  # real reliability jump, so it's the default rather than an opt-in.
  ollama_tag: "hf.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M"
  est_ram_gb: 2.0
  keep_alive: "5m"
  context_window: 8192
  fallback_tag: "qwen2.5:7b"  # further quality bump, opt-in only: measured 12+ minutes for one
  fallback_tier: "high"       # request on this CPU-only laptop, unusable interactively as a default.

researcher_rag:
  role: "long document reading, PDF/file Q&A, retrieval-augmented answers"
  ollama_tag: "hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"  # same tag as writer_general —
  est_ram_gb: 1.3                                             # 32k context is plenty for chunked
  keep_alive: "5m"                                            # RAG text, and reusing the tag means
  context_window: 16384                                       # no reload when handed off from writer.

tool_caller:
  role: "structured tool/function calling — web search, system actions, multi-step tool use"
  ollama_tag: "hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"  # same tag again — Qwen2.5 1.5B
  est_ram_gb: 1.3                                             # supports tool calling natively.
  keep_alive: "5m"
  context_window: 8192

vision:
  role: "image understanding (only loaded when a file is an image)"
  ollama_tag: "moondream:1.8b"   # already tiny and purpose-built for this; kept as-is
  est_ram_gb: 1.8
  keep_alive: "0"                # unload immediately after use
  context_window: 2048
  fallback_tag: "llava:7b"       # higher quality, used only on "high" tier hardware
  fallback_tier: "high"

tarjuman:
  role: "document translation (.docx) — precision text task, not chat"
  # Measured, not assumed: the small Qwen models used everywhere else in
  # this registry have a reproducible foreign-script leak on this specific
  # task (translating "local" came back as Hebrew, then separately as
  # Chinese, across different runs of the identical input). llama3.1:8b
  # produced a clean, fully correct translation on the first try, same
  # input. A document translation is a slower, less latency-sensitive
  # action than a chat reply, so the 8B model's extra cost is worth paying
  # here specifically — this is the one role that opts out of "small by
  # default" on evidence, the same way `coder` opted up from 1.5B to 3B.
  ollama_tag: "llama3.1:latest"
  est_ram_gb: 4.9
  keep_alive: "5m"
  context_window: 8192

# Hardware tiers — resolved once at startup by orchestrator/hardware.py
tiers:
  min:
    max_ram_gb: 8
    disable_roles: ["vision"]
    force_fallback_small: true
  std:
    max_ram_gb: 16
    disable_roles: []
  high:
    max_ram_gb: 32
    disable_roles: []
    allow_fallback_large: true
