# Model registry — the single source of truth for every agent role.
#
# Every pick below was measured with `python -m benchmarks.run_benchmark` on this
# class of machine (i7-11370H, 15.8 GB RAM, CPU-only inference); numbers are in the
# comments next to each choice. Re-run it (and `pytest -m live`) before changing a tag.
#
# Sources: tags starting with hf.co/ are pulled through Ollama from Hugging Face.
# The two Qwen3 builds below were imported from the official unsloth GGUF files
# with `ollama create` (Ollama 0.34's hf.co pull is blocked by the new Xet CDN
# redirect), so their names are local:
#   qwen3-4b-instruct-2507:Q4_K_M   <- unsloth/Qwen3-4B-Instruct-2507-GGUF   (2.5 GB)
#   qwen3-embedding:0.6b            <- Ollama library, official Qwen3-Embedding  (0.64 GB)
#
# tier: "min"  -> used when detected free RAM < min_ram_gb_recommended (config/hardware.py)
# tier: "std"  -> default tier for a normal 16GB machine

router:
  role: "task classifier — stage 2 of routing (only runs when the embedding match is ambiguous)"
  # Stage-2 accuracy on messages the router was never tuned on (36 Arabic/English
  # requests): Qwen2.5-0.5B ~40% (roughly chance), Qwen2.5-1.5B 83%, Qwen3-4B-Instruct-2507 92%.
  # Same tag as `tarjuman`, so the two roles share one loaded model — no extra RAM, no reload.
  ollama_tag: "qwen3-4b-instruct-2507:Q4_K_M"
  est_ram_gb: 2.5
  keep_alive: "15m"
  context_window: 8192

embedder:
  role: "semantic routing (stage 1) + tool retrieval + RAG embeddings"
  # Best single-match routing accuracy: nomic-embed-text 62% / 75% (dev / holdout) vs
  # Qwen3-Embedding-0.6B 88% / 81% — nomic is English-centric and scores every Arabic
  # message ~0.8, so it can't separate roles. Changing this value starts a fresh Chroma
  # collection; DocumentStore.reindex_missing() rebuilds it from data/uploads at startup.
  ollama_tag: "qwen3-embedding:0.6b"
  est_ram_gb: 0.7
  keep_alive: "30m"
  context_window: 8192

writer_general:
  role: "general chat, Arabic/English writing, summarizing, reasoning"
  # Writing 6/6, RAG 4/4 at 20 tok/s / 1.1 GB. Qwen3-4B-2507 is 2.5x slower with no benchmark
  # win here (writing 5/6, RAG 2/4 — it invents answers instead of saying "not in the document").
  ollama_tag: "hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
  est_ram_gb: 1.3
  keep_alive: "5m"
  context_window: 8192

coder:
  role: "code generation, debugging, shell/script authoring"
  # Coding benchmark (8 executed-against-asserts tasks): Coder-3B 8/8, Qwen2.5-1.5B 7/8,
  # qwen2.5:3b 7/8, Qwen3-4B-2507 8/8 after code-punctuation clean-up but 2.5x slower.
  # 1.5B is unreliable on Arabic coding requests (mangled "تعكس نص" into an unrelated print
  # function twice); 3B fixed it.
  ollama_tag: "hf.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M"
  est_ram_gb: 2.0
  keep_alive: "5m"
  context_window: 8192
  fallback_tag: "qwen2.5:7b"  # further quality bump, opt-in only: measured 12+ minutes for one
  fallback_tier: "high"       # request on this CPU-only laptop, unusable interactively as a default.

researcher_rag:
  role: "long document reading, PDF/file Q&A, retrieval-augmented answers"
  ollama_tag: "hf.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"  # same tag as writer_general —
  est_ram_gb: 1.3                                             # no reload when handed off from writer.
  keep_alive: "5m"
  context_window: 16384

tool_caller:
  role: "structured tool/function calling — web search, calculator, files, translation, system actions"
  # Tool selection with the production tool set (11 cases): qwen2.5:3b 11/11, Qwen3-1.7B 9/11,
  # Qwen2.5-1.5B 8/11, Qwen3-4B-2507 8/11 (it picked list_uploaded_files instead of reading a
  # named file, and answered weather questions from memory). Worth the extra 0.8 GB and ~2x
  # latency vs the 1.5B because a wrong tool call is a wrong answer.
  ollama_tag: "qwen2.5:3b"
  est_ram_gb: 1.9
  keep_alive: "5m"
  context_window: 8192

vision:
  role: "image understanding (only loaded when a file is an image)"
  ollama_tag: "moondream:1.8b"   # already tiny and purpose-built for this; kept as-is
  est_ram_gb: 1.8
  keep_alive: "0"                # unload immediately after use
  context_window: 2048
  fallback_tag: "llava:7b"       # higher quality, used only on "high" tier hardware
  fallback_tier: "high"

council:
  role: >-
    multi-agent coordinator — breaks a compound request into parts and
    delegates each part to a specialist agent (writer/coder/researcher)
    via tool calls, then merges their answers
  ollama_tag: "qwen2.5:3b"     # same tag as tool_caller: delegation is tool calling (11/11 above)
  est_ram_gb: 1.9
  keep_alive: "5m"
  context_window: 8192

tarjuman:
  role: "document translation (.docx) — precision text task, not chat"
  # EN->AR, 16 sentences (8 general + 8 contract-grade with known-wrong-answer markers):
  #   Qwen3-4B-Instruct-2507  13/16  7.6 tok/s  2.5 GB   <- chosen
  #   llama3.1:8b (previous)  13/16  4.8 tok/s  4.9 GB
  #   qwen3:8b                13/16  4.3 tok/s  5.2 GB
  #   gemma3:4b               13/16  9.4 tok/s  3.3 GB   fluent, but on a real document it ADDED text
  #                           ("and the client company" in a footer) and dropped a word — unacceptable for contracts
  #   qwen2.5:7b               8/16;  Qwen2.5 1.5B / 3B: 1/4 — leak Chinese/Hebrew words into the Arabic
  # Same accuracy as the 8B models at ~1.6x the speed and half the RAM, and it shares the router's model.
  # The keyword scores hide what matters, so tools/tarjuman.py never sends formatting tags to the model
  # (they made this model turn "two percent" into "200%") and applies config/tarjuman_glossary.yaml
  # to isolated labels ("Confidential" -> "مُخفي" otherwise). See `python -m benchmarks.tarjuman_live`.
  ollama_tag: "qwen3-4b-instruct-2507:Q4_K_M"
  est_ram_gb: 2.5
  keep_alive: "15m"
  context_window: 8192

# Hardware tiers — resolved once at startup by orchestrator/hardware.py
tiers:
  min:
    max_ram_gb: 8
    disable_roles: ["vision"]
    force_fallback_small: true
  std:
    max_ram_gb: 16
    disable_roles: []
  high:
    max_ram_gb: 32
    disable_roles: []
    allow_fallback_large: true
